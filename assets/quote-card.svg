<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Working principle: build the smallest thing that proves the idea, then let the evidence argue for it.">
<rect x="0" y="0" width="900" height="190" rx="16" fill="#FAF9F5"/>
<rect x="1.2" y="1.2" width="897.6" height="187.6" rx="15" fill="none" stroke="#DC7759" stroke-width="2"/>
<text x="450.0" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing="3.4" fill="#C15F3C">WORKING PRINCIPLE</text>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
</style>
<g class="spin"><line x1="454.0" y1="60.0" x2="460.0" y2="60.0" stroke="#141413" stroke-width="2.2" stroke-linecap="round"/><line x1="452.0" y1="63.5" x2="455.0" y2="68.7" stroke="#141413" stroke-width="2.2" stroke-linecap="round"/><line x1="448.0" y1="63.5" x2="445.0" y2="68.7" stroke="#141413" stroke-width="2.2" stroke-linecap="round"/><line x1="446.0" y1="60.0" x2="440.0" y2="60.0" stroke="#141413" stroke-width="2.2" stroke-linecap="round"/><line x1="448.0" y1="56.5" x2="445.0" y2="51.3" stroke="#141413" stroke-width="2.2" stroke-linecap="round"/><line x1="452.0" y1="56.5" x2="455.0" y2="51.3" stroke="#141413" stroke-width="2.2" stroke-linecap="round"/></g>
<text x="450.0" y="105" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#141413">Build the smallest thing that proves the idea,</text>
<text x="450.0" y="139" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#141413">then let the evidence argue for it.</text>
<line x1="410.0" y1="156" x2="490.0" y2="156" stroke="#E8DFD3" stroke-width="1.5"/>
<text x="450.0" y="176" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="14" fill="#C15F3C">— Tony</text>
</svg>